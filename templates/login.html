<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Programas Bienestar</title>
    <!-- Carga de Bootstrap y Fuentes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #f4f7f6 0%, #e2e8f0 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            margin: 1rem;
        }
        .login-header {
            background: linear-gradient(135deg, #691C32, #8d2643);
            padding: 2.5rem 1.5rem;
            text-align: center;
            color: white;
        }
        .form-control {
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            border: 1px solid #dee2e6;
            background-color: #f8f9fa;
        }
        .form-control:focus {
            border-color: #691C32;
            box-shadow: 0 0 0 0.25rem rgba(105, 28, 50, 0.15);
            background-color: #fff;
        }
        .input-group-text {
            border-radius: 0.5rem 0 0 0.5rem;
            border: 1px solid #dee2e6;
        }
        .btn-guinda {
            background: linear-gradient(135deg, #691C32, #8d2643);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            padding: 0.75rem;
            transition: 0.3s;
        }
        .btn-guinda:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(105, 28, 50, 0.4);
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-shield-lock-fill mb-2" style="font-size: 3.5rem;"></i>
            <h4 class="fw-bold mt-2 mb-0">Programas Bienestar</h4>
            <p class="small text-white-50 mb-0 mt-1">Plataforma Oficial de Captura</p>
        </div>
        
        <div class="p-4 px-md-5 py-md-4">
            {% if error %}
            <div class="alert alert-danger rounded-3 small fw-bold text-center py-2 shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
            </div>
            {% endif %}

            <!-- El autocomplete="off" bloquea las sugerencias del navegador -->
            <form action="/login" method="POST" autocomplete="off">
                
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">Usuario Asignado</label>
                    <div class="input-group shadow-sm rounded-3">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-person-fill text-muted"></i></span>
                        <input type="text" name="username" class="form-control border-start-0 ps-0" required autocomplete="off" placeholder="Ej. admin">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-muted">Contraseña</label>
                    <!-- autocomplete="new-password" engaña a Chrome para que no rellene contraseñas guardadas -->
                    <div class="input-group shadow-sm rounded-3">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-key-fill text-muted"></i></span>
                        <input type="password" name="password" class="form-control border-start-0 ps-0" required autocomplete="new-password" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn btn-guinda w-100 mt-2 fs-6 shadow-sm">
                    Ingresar al Sistema <i class="bi bi-box-arrow-in-right ms-2"></i>
                </button>
            </form>
        </div>
    </div>

</body>
</html>
